name: Scrape CPCB Data

on:
  workflow_dispatch:
  schedule:
    # Runs at the beginning of every hour (UTC)
    - cron: '0 * * * *'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    # Allow GITHUB_TOKEN to push commits back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tabulate

      - name: Run the scraper
        id: scrape
        continue-on-error: true
        run: python cpcb_scraper.py

      - name: Commit data + progress files
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.csv scrape_log.csv STATUS.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update water quality data + progress log"
          git push

      - name: Fail job if scraper failed
        if: steps.scrape.outcome == 'failure'
        run: exit 1
